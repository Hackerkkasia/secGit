<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <script>
    function sum(a,b){
        console.log(a+b);
    }
    function multi(a,b){
console.log(a*b)
    }
    function calculator(a,b,sumCallback){
        sumCallback(a,b);
    }
    calculator(1,2,sum)
    calculator(1,2,multi)

    calculator(1,2,(a,b)=>{
        console.log(a+b);
    })
    </script>
</body>
</html>
