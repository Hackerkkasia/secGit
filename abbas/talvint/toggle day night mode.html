<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .black {
            background-color: black;
            color:white;
        }
        .white {
            background-color: rgb(255, 255, 255);
            color:rgb(0, 0, 0);
        }
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  -webkit-transition: .4s;
  transition: .4s;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  -webkit-transition: .4s;
  transition: .4s;
}

input:checked + .slider {
  background-color: #2196F3;
}

input:focus + .slider {
  box-shadow: 0 0 1px #2196F3;
}

input:checked + .slider:before {
  -webkit-transform: translateX(26px);
  -ms-transform: translateX(26px);
  transform: translateX(26px);
}

.slider.round {
  border-radius: 34px;
}

.slider.round:before {
  border-radius: 50%;
}
    </style>
</head>

<body bgcolor="white" id="body">

    <div class="switch">
        <label class="switch" id="new">
  <input type="checkbox">
  <span class="slider round"></span>
</label>
    </div>

    <div class="text">
        <span>can chance this Page to Dark Mode</span>
    </div>

    <script>
        const toggleButton = document.getElementById('ne');
        const body = document.body;

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                toggleButton.textContent = 'Switch to Light Mode';
                document.getElementById("body").classList.add("black")
            } else {
                toggleButton.textContent = 'Switch to Dark Mode';
                document.getElementById("body").classList.add("white")
            }
        });
    </script>

</body>

</html>
